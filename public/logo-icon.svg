<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Comic Halftone Pattern -->
    <pattern id="shield-halftone" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#e8a87c" fill-opacity="0.35"/>
    </pattern>

    <!-- Warm Apricot-Peach Accent Shield Gradient (#e8a87c) -->
    <linearGradient id="shield-accent-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8dcce"/>
      <stop offset="35%" stop-color="#e8a87c"/>
      <stop offset="70%" stop-color="#b86e3f"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="shield-inner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24172f"/>
      <stop offset="60%" stop-color="#140d21"/>
      <stop offset="100%" stop-color="#090611"/>
    </linearGradient>

    <!-- Letter F Gradient (Electric Midnight & Cyan) -->
    <linearGradient id="f-letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Letter V Gradient (Royal Purple & Warm Accent Glow) -->
    <linearGradient id="v-letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Drop Shadow for Comic Inking -->
    <filter id="comic-crest-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Comic Action Rays in Accent Color (#e8a87c) -->
  <path d="M 60 10 L 85 2 L 68 18 Z" fill="#e8a87c" stroke="#000" stroke-width="1.5"/>
  <path d="M 108 26 L 118 36 L 102 40 Z" fill="#f8dcce" stroke="#000" stroke-width="1.5"/>
  <path d="M 12 26 L 2 36 L 18 40 Z" fill="#e8a87c" stroke="#000" stroke-width="1.5"/>
  <path d="M 60 114 L 74 120 L 64 108 Z" fill="#e8a87c" stroke="#000" stroke-width="1.5"/>

  <!-- Outer Superhero Shield Crest in Accent #e8a87c -->
  <path d="M 60 10 Q 82 14 106 20 Q 102 75 60 114 Q 18 75 14 20 Q 38 14 60 10 Z" 
        fill="url(#shield-accent-border)" 
        stroke="#000000" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#comic-crest-shadow)"/>

  <!-- Inner Shield Bevel Rim -->
  <path d="M 60 16 Q 80 19 100 25 Q 96 71 60 107 Q 24 71 20 25 Q 40 19 60 16 Z" 
        fill="url(#shield-inner-bg)" 
        stroke="#000000" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Halftone Screen Texture inside shield in Accent Tone -->
  <path d="M 60 16 Q 80 19 100 25 Q 96 71 60 107 Q 24 71 20 25 Q 40 19 60 16 Z" 
        fill="url(#shield-halftone)"/>

  <!-- Comic Energy Burst inside Shield in Warm Accent -->
  <polygon points="60,25 66,42 82,34 72,48 90,56 74,64 82,80 66,72 60,90 54,72 38,80 46,64 30,56 48,48 38,34 54,42" 
           fill="#e8a87c" 
           fill-opacity="0.4" 
           stroke="#000" 
           stroke-width="1"/>

  <!-- DISTINCT CAPITAL LETTER F -->
  <!-- Left letter: clear vertical stem, clear top arm, clear middle arm -->
  <g filter="url(#comic-crest-shadow)">
    <!-- Letter F Body -->
    <path d="M 28 32 L 66 32 L 64 43 L 42 43 L 41 53 L 58 53 L 56 64 L 40 64 L 35 91 L 24 91 Z" 
          fill="url(#f-letter-grad)" 
          stroke="#000000" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>
    <!-- Cel Light Glints on F -->
    <path d="M 31 35 L 62 35" stroke="#f8dcce" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 46 L 26 86" stroke="#f8dcce" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- DISTINCT CAPITAL LETTER V -->
  <!-- Right letter: clear chevron meeting at a sharp bottom point -->
  <g filter="url(#comic-crest-shadow)">
    <!-- Letter V Body -->
    <path d="M 52 44 L 69 88 L 82 88 L 98 44 L 84 44 L 75 73 L 64 44 Z" 
          fill="url(#v-letter-grad)" 
          stroke="#000000" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>
    <!-- Cel Light Glints on V -->
    <path d="M 87 47 L 76 77" stroke="#f8dcce" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 47 L 62 66" stroke="#f8dcce" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent Shimmer Points (#e8a87c) -->
  <circle cx="60" cy="10" r="2.5" fill="#ffffff"/>
  <circle cx="106" cy="20" r="2" fill="#f8dcce"/>
  <circle cx="14" cy="20" r="2" fill="#f8dcce"/>
  <circle cx="60" cy="114" r="2.5" fill="#e8a87c"/>
</svg>
